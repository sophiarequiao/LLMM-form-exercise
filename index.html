<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/procesar" method="post">
        <fieldset>
            <legend>Datos del cliente</legend>
            <label for="name">Nombre completo</label>
            <input type="text" id = "name" name="name" required placeholder="Pepito Pepito Pepito">
            <label for="email">Correo electrónico</label>
            <input type="email" id = "email" name="email" required pattern="[a-zA-Z0-9_]+@[a-zA-Z0-9]+.com" placeholder="pepito@gmail.com">
            <label for="phoneNumber">Telefono</label>
            <input type="tel" id = "phoneNumber" name="phoneNumber" pattern="[0-9]{9}" placeholder="012345678">
            <label for="dateOfBirth">Fecha de nacimiento</label>
            <input type="date" id = "dateOfBirth" name="dateOfBirth" required max="2008-10-13">  
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" minlength="8">
        </fieldset> 

        <fieldset>  
            <legend>Datos del viaje</legend>
            <label for="departureDate">Fecha de despegue</label>
            <input type="date" id = "departureDate" name="departureDate" required min="2026-10-14">
            <label for="numberOfTravellers">Número de pasajeros/as</label>
            <input type="number" name="numberOfTravellers" id="numberOfTravellers" min="1" max="4">
            <label for="cabinClass">Clase de cabina</label>
            <select name="cabinClass" id="cabinClass">
                <option value=""> --Elige una opción--</option>
                <option value="Economy">Económica</option>
                <option value="Business">Business</option>
                <option value="viewCabin">Suite con vistas</option>
            </select>
            <fieldset>
                <legend>Tipo de traje espacial</legend>
                <input type="radio" name="typeOfSpacesuit" id="classic" value = "classic">
                <label for="classic">Clásico</label>
                <input type="radio" name="typeOfSpacesuit" id="premium" value="premium">
                <label for="premium">Premium</label>
                <input type="radio" name="typeOfSpacesuit" id="light" value="light">
                <label for="classic">Light</label>
            </fieldset>
            <label for="lunarDestinations">Elija tu destinación</label>
            <input list="suggestedDestination" id="lunarDestinations" name="lunarDestinations">
            <datalist id="suggestedDestination">
                <option value="Mar de la tranquilidad"></option>
                <option value="Cráter lunar central"></option>
            </datalist>
        </fieldset>

        <fieldset>
            <legend>Extras y preferencias</legend>
            <fieldset>
                <input type="checkbox" id = "gourmetFood" name="extraService" value = "gourmetFood">
                <label for="gourmetFood">Comida gourmet</label>
                <input type="checkbox" id = "earthPicture" name="extraService" value = "earthPicture">
                <label for="earthPicture">Foto con la Tierra de fondo</label>
                <input type="checkbox" id = "meteoriteInsurance" name="extraService" value = "meteoriteInsurance">
                <label for="meteoriteInsurance">Seguro de meteoritos</label>
                <input type="checkbox" id = "souvenirs" name="extraService" value = "souvenirs">
                <label for="souvenirs">Souvenirs</label>
            </fieldset>
            <label for="heightScare">Nivel de miedo a las alturas</label>
            <input type="range" name="heightScare" id="heightScare" min="0" max="10">
            <label for="comments">Comentarios</label>
            <textarea name="comments" id="comments"></textarea>
            <label for="conditions">Acepto las condiciones</label>
            <input type="checkbox" id="conditions" name="conditions" required>
        </fieldset>
        
        <button type="submit">Reservar mi plaza</button>
        <button type="reset">Empezar de nuevo</button>
    </form>
    
</body>
</html>
